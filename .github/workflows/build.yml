name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept SDK licenses (lets Gradle fetch the compile SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # The release build is signed with the debug key. A stable key keeps the APK installable over the one on the phones;
      # without the secret CI generates a fresh debug key and the APK will not update an existing install.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 not set; signing with a throwaway debug key"
          fi

      # gradle.properties pins org.gradle.java.home to a local JDK path; the command line wins over it.
      - name: Unit tests
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:testDebugUnitTest

      - name: Build release APK
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: harmony-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
